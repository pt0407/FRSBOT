<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FRSBOT replay viewer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #ddd; display: flex; height: 100vh; }
  #list { width: 320px; overflow-y: auto; border-right: 1px solid #333; }
  #list input { width: calc(100% - 16px); margin: 8px; padding: 6px; background: #1b1b1b; color: #ddd; border: 1px solid #333; border-radius: 4px; }
  .run { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #1d1d1d; }
  .run:hover { background: #1d1d1d; }
  .run.sel { background: #26324a; }
  .run .meta { color: #888; font-size: 12px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #info { padding: 10px 14px; border-bottom: 1px solid #333; }
  #info b { font-size: 15px; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #controls { padding: 8px 14px; border-top: 1px solid #333; display: flex; gap: 12px; align-items: center; }
  #controls input[type=range] { flex: 1; }
  button { background: #26324a; color: #ddd; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  #readout { font-variant-numeric: tabular-nums; min-width: 260px; text-align: right; color: #aaa; }
</style>
</head>
<body>
<div id="list"><input id="filter" placeholder="filter by name, team, id" /><div id="runs"></div></div>
<div id="main">
  <div id="info"><b id="title">Select a run</b><div id="sub" class="meta"></div></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="controls">
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" />
    <span id="readout"></span>
  </div>
</div>
<script src="replays.js"></script>
<script>
const runsEl = document.getElementById('runs');
const filterEl = document.getElementById('filter');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const readout = document.getElementById('readout');
let current = null, playing = false, t = 0, last = 0;

const TICKS_PER_SEC = 60;

function renderList() {
  const q = filterEl.value.trim().toLowerCase();
  runsEl.innerHTML = '';
  for (const r of window.REPLAYS) {
    const hay = `${r.name} ${r.team} ${r.id}`.toLowerCase();
    if (q && !hay.includes(q)) continue;
    const div = document.createElement('div');
    div.className = 'run' + (current && current.id === r.id ? ' sel' : '');
    div.innerHTML = `<div><b>${r.name}</b> &middot; team ${r.team}</div>` +
      `<div class="meta">score ${r.score ?? '-'} &middot; board ${r.board ?? '-'} &middot; ${r.samples.length} samples</div>`;
    div.onclick = () => select(r);
    runsEl.appendChild(div);
  }
}

function select(r) {
  current = r;
  t = 0; playing = false; playBtn.textContent = 'Play';
  document.getElementById('title').textContent = `${r.name} (team ${r.team})`;
  document.getElementById('sub').textContent = `${r.kind} run, alliance ${r.alliance}, ${(r.durationMs / 1000).toFixed(0)} s, score ${r.score}`;
  renderList();
  draw();
}

function bounds(samples) {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const s of samples) { x0 = Math.min(x0, s[1]); x1 = Math.max(x1, s[1]); z0 = Math.min(z0, s[2]); z1 = Math.max(z1, s[2]); }
  const pad = 0.8;
  return { x0: x0 - pad, x1: x1 + pad, z0: z0 - pad, z1: z1 + pad };
}

function sizeCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// interpolate pose at time t (seconds)
function poseAt(samples, sec) {
  const tick = sec * TICKS_PER_SEC + samples[0][0];
  let i = 0;
  while (i < samples.length - 2 && samples[i + 1][0] < tick) i++;
  const a = samples[i], b = samples[Math.min(i + 1, samples.length - 1)];
  const f = b[0] === a[0] ? 0 : Math.min(1, Math.max(0, (tick - a[0]) / (b[0] - a[0])));
  const lerp = (p, q) => p + (q - p) * f;
  return { x: lerp(a[1], b[1]), z: lerp(a[2], b[2]), yaw: a[3], vx: lerp(a[4], b[4]), vz: lerp(a[5], b[5]), hopper: (tick >= b[0] ? b : a)[6], tick };
}

function draw() {
  sizeCanvas();
  const W = canvas.getBoundingClientRect().width, H = canvas.getBoundingClientRect().height;
  ctx.fillStyle = '#151515'; ctx.fillRect(0, 0, W, H);
  if (!current) return;
  const S = current.samples;
  const b = bounds(S);
  const scale = Math.min(W / (b.x1 - b.x0), H / (b.z1 - b.z0));
  const ox = W / 2 - ((b.x0 + b.x1) / 2) * scale, oz = H / 2 - ((b.z0 + b.z1) / 2) * scale;
  const px = x => ox + x * scale, pz = z => oz + z * scale;

  // axes (field origin)
  ctx.strokeStyle = '#2a2a2a'; ctx.beginPath();
  ctx.moveTo(px(0), 0); ctx.lineTo(px(0), H); ctx.moveTo(0, pz(0)); ctx.lineTo(W, pz(0)); ctx.stroke();

  // full path, dim
  ctx.strokeStyle = '#3a4a6a'; ctx.lineWidth = 2; ctx.beginPath();
  S.forEach((s, i) => i ? ctx.lineTo(px(s[1]), pz(s[2])) : ctx.moveTo(px(s[1]), pz(s[2])));
  ctx.stroke();

  // played portion, bright
  const p = poseAt(S, t);
  ctx.strokeStyle = '#4fcfff'; ctx.lineWidth = 3; ctx.beginPath();
  let started = false;
  for (const s of S) {
    if (s[0] > p.tick) break;
    if (!started) { ctx.moveTo(px(s[1]), pz(s[2])); started = true; } else ctx.lineTo(px(s[1]), pz(s[2]));
  }
  ctx.lineTo(px(p.x), pz(p.z)); ctx.stroke();

  // sample dots
  ctx.fillStyle = '#5a6b8a';
  for (const s of S) { ctx.beginPath(); ctx.arc(px(s[1]), pz(s[2]), 2, 0, Math.PI * 2); ctx.fill(); }

  // robot
  const rx = px(p.x), rz = pz(p.z), len = 14;
  ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.arc(rx, rz, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(rx, rz); ctx.lineTo(rx + Math.cos(-p.yaw) * len, rz + Math.sin(-p.yaw) * len); ctx.stroke();

  const speed = Math.hypot(p.vx, p.vz);
  readout.textContent = `t ${t.toFixed(1)} s  tick ${Math.round(p.tick)}  hopper ${p.hopper ?? '-'}  speed ${speed.toFixed(2)} m/s  yaw ${(p.yaw * 180 / Math.PI).toFixed(0)}°`;
  const total = (S[S.length - 1][0] - S[0][0]) / TICKS_PER_SEC;
  scrub.value = total ? (t / total) * 1000 : 0;
}

function duration() { return current ? (current.samples[current.samples.length - 1][0] - current.samples[0][0]) / TICKS_PER_SEC : 0; }

function frame(now) {
  if (playing) {
    t += (now - last) / 1000;
    if (t >= duration()) { t = duration(); playing = false; playBtn.textContent = 'Play'; }
  }
  last = now;
  draw();
  requestAnimationFrame(frame);
}

playBtn.onclick = () => {
  if (!current) return;
  if (t >= duration()) t = 0;
  playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play';
};
scrub.oninput = () => { if (current) { t = (scrub.value / 1000) * duration(); playing = false; playBtn.textContent = 'Play'; draw(); } };
filterEl.oninput = renderList;
window.onresize = draw;

renderList();
requestAnimationFrame(frame);
</script>
</body>
</html>

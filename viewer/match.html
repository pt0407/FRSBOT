<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FRSBOT match viewer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #ddd; display: flex; flex-direction: column; height: 100vh; }
  #top { padding: 10px 14px; border-bottom: 1px solid #333; display: flex; gap: 24px; align-items: center; }
  #score { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .blue { color: #4f8cff; } .red { color: #ff5a5a; }
  #phase { color: #aaa; text-transform: uppercase; letter-spacing: 0.04em; }
  .hub { padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #222; }
  .hub.on { background: #1f3f2a; color: #7fe39a; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #controls { padding: 8px 14px; border-top: 1px solid #333; display: flex; gap: 12px; align-items: center; }
  #controls input[type=range] { flex: 1; }
  button { background: #26324a; color: #ddd; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  #readout { font-variant-numeric: tabular-nums; min-width: 300px; text-align: right; color: #aaa; }
</style>
</head>
<body>
<div id="top">
  <div id="score"><span class="blue" id="sb">0</span> &ndash; <span class="red" id="sr">0</span></div>
  <div id="phase"></div>
  <div class="hub" id="hubBlue">blue hub</div>
  <div class="hub" id="hubRed">red hub</div>
</div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" />
  <span id="readout"></span>
</div>
<script src="match.js"></script>
<script>
const M = window.MATCH;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const readout = document.getElementById('readout');
const frames = M.frames;
const duration = frames[frames.length - 1].t;
const COLORS = { blue: '#4f8cff', red: '#ff5a5a' };
let t = 0, playing = false, last = 0;

// fixed field window from every frame, so the view doesn't jump
const bounds = (() => {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const f of frames) {
    for (const [x, z] of f.fuel) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
    for (const r of f.robots) { x0 = Math.min(x0, r.x); x1 = Math.max(x1, r.x); z0 = Math.min(z0, r.z); z1 = Math.max(z1, r.z); }
  }
  const pad = 0.8;
  return { x0: x0 - pad, x1: x1 + pad, z0: z0 - pad, z1: z1 + pad };
})();

function frameAt(sec) {
  let i = 0;
  while (i < frames.length - 1 && frames[i + 1].t <= sec) i++;
  return frames[i];
}

function sizeCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [r.width, r.height];
}

function draw() {
  const [W, H] = sizeCanvas();
  ctx.fillStyle = '#151515'; ctx.fillRect(0, 0, W, H);
  const scale = Math.min(W / (bounds.x1 - bounds.x0), H / (bounds.z1 - bounds.z0));
  const ox = W / 2 - ((bounds.x0 + bounds.x1) / 2) * scale;
  const oz = H / 2 - ((bounds.z0 + bounds.z1) / 2) * scale;
  const px = x => ox + x * scale, pz = z => oz + z * scale;

  const f = frameAt(t);
  ctx.fillStyle = '#5a5a5a';
  for (const [x, z] of f.fuel) { ctx.beginPath(); ctx.arc(px(x), pz(z), 2, 0, Math.PI * 2); ctx.fill(); }

  for (const r of f.robots) {
    const color = COLORS[r.alliance];
    const rx = px(r.x), rz = pz(r.z), radius = 9;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(rx, rz, radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(rx, rz); ctx.lineTo(rx + Math.cos(r.a) * 18, rz - Math.sin(r.a) * 18); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '12px -apple-system, sans-serif';
    ctx.fillText(`${r.team} · ${r.hopper}`, rx + 12, rz - 10);
  }

  document.getElementById('sb').textContent = Math.round(f.scores.blue ?? 0);
  document.getElementById('sr').textContent = Math.round(f.scores.red ?? 0);
  document.getElementById('phase').textContent = f.phase;
  document.getElementById('hubBlue').classList.toggle('on', !!f.hubs.blue);
  document.getElementById('hubRed').classList.toggle('on', !!f.hubs.red);
  readout.textContent = `t ${f.t.toFixed(1)} s / ${duration.toFixed(0)} s`;
  scrub.value = duration ? (t / duration) * 1000 : 0;
}

function frame(now) {
  if (playing) {
    t += (now - last) / 1000;
    if (t >= duration) { t = duration; playing = false; playBtn.textContent = 'Play'; }
  }
  last = now;
  draw();
  requestAnimationFrame(frame);
}

playBtn.onclick = () => {
  if (t >= duration) t = 0;
  playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play';
};
scrub.oninput = () => { t = (scrub.value / 1000) * duration; playing = false; playBtn.textContent = 'Play'; draw(); };
window.onresize = draw;
requestAnimationFrame(frame);
</script>
</body>
</html>
